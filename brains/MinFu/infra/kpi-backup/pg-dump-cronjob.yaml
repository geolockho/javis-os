# pg_dumpall (toàn bộ DB + roles) mỗi đêm 02:00 -> gzip -> S3. Namespace kpi-backend.
# Password lấy từ secret có sẵn `postgres` (key postgres-password). Image pg trùng major với server (18.4).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-dump
  namespace: kpi-backend
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: dump
              image: docker.io/postgres:18.4
              env:
                - { name: PGHOST, value: postgres }
                - { name: PGPORT, value: "5432" }
                - { name: PGUSER, value: postgres }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: postgres, key: postgres-password }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  F=/backup/pg-$(date +%Y%m%d-%H%M%S).sql.gz
                  pg_dumpall --clean --if-exists | gzip -9 > "$F"
                  # kiểm tra file gzip hợp lệ và không rỗng
                  gzip -t "$F"
                  test "$(stat -c%s "$F")" -gt 1024
                  ls -lh /backup
              volumeMounts:
                - { name: backup, mountPath: /backup }
            - name: upload
              image: docker.io/rclone/rclone:1.75.2
              env:
                - { name: RCLONE_CONFIG_S3_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_S3_PROVIDER, value: Minio }
                - { name: RCLONE_CONFIG_S3_ENDPOINT, value: "https://s3-storage-kpis.mof.gov.vn" }
                - name: RCLONE_CONFIG_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: backup-s3, key: S3_ACCESS_KEY }
                - name: RCLONE_CONFIG_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: backup-s3, key: S3_SECRET_KEY }
              command: ["rclone"]
              args: ["--ca-cert", "/etc/s3-ca/ca.pem", "copy", "/backup/", "s3:btc/etcd-backup/kpi/postgres/"]
              volumeMounts:
                - { name: backup, mountPath: /backup }
                - { name: s3-ca, mountPath: /etc/s3-ca, readOnly: true }
            - name: retention
              image: docker.io/rclone/rclone:1.75.2
              env:
                - { name: RCLONE_CONFIG_S3_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_S3_PROVIDER, value: Minio }
                - { name: RCLONE_CONFIG_S3_ENDPOINT, value: "https://s3-storage-kpis.mof.gov.vn" }
                - name: RCLONE_CONFIG_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: backup-s3, key: S3_ACCESS_KEY }
                - name: RCLONE_CONFIG_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: backup-s3, key: S3_SECRET_KEY }
                - { name: RETENTION, value: "14d" }
              command: ["rclone"]
              args: ["--ca-cert", "/etc/s3-ca/ca.pem", "delete", "s3:btc/etcd-backup/kpi/postgres/", "--min-age", "$(RETENTION)"]
              volumeMounts:
                - { name: s3-ca, mountPath: /etc/s3-ca, readOnly: true }
          containers:
            - name: complete
              image: docker.io/postgres:18.4
              command: ["/bin/true"]
          volumes:
            - name: backup
              emptyDir: {}
            - name: s3-ca
              configMap: { name: s3-ca }


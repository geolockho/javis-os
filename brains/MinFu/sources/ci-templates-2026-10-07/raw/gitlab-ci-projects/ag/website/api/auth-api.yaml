# build image auth
build-test-auth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/atlantic-group/web/api/auth
    DOCKERFILE: ./Environments/Testing/Auth.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/AG.Identity/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-staging-auth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/atlantic-group/web/api/auth
    DOCKERFILE: ./Environments/Staging/Auth.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/AG.Identity/**/*
      - Services/Shared/**/*
    refs:
      - staging

build-prod-auth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/atlantic-group/web/api/auth
    DOCKERFILE: ./Environments/Production/Auth.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/AG.Identity/**/*
      - Services/Shared/**/*
    refs:
      - main
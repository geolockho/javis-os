# build image fe
build-test-web:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/atlantic-group/web/web
    DOCKERFILE: ./Dockerfile
  extends: .build-image-gitlab-registry
  only:
    refs:
    - testting

build-staging-web:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/atlantic-group/web/web
    DOCKERFILE: ./Dockerfile
  extends: .build-image-gitlab-registry
  only:
    - staging

build-prod-web:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/atlantic-group/web/web
    DOCKERFILE: ./Dockerfile
  extends: .build-image-gitlab-registry
  only:
    refs:
      - /^prod-[0-9]+\.[0-9]+\.[0-9]+$/
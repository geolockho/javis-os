# build image hangfire
build-test-hangfire:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/hangfire
    DOCKERFILE: ./Environments/Testing/Hangfire.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "testing"'
      changes:
        - Environments/Testing/Hangfire.Testing.Dockerfile
        - Services/Fsel.Hangfire/**/*
        - Services/Shared/**/*

build-staging-hangfire:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/hangfire
    DOCKERFILE: ./Environments/Staging/Hangfire.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      changes:
        - Services/Fsel.Hangfire/**/*
        - Services/Shared/**/*
        
build-pre-prod-hangfire:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/hangfire
    DOCKERFILE: ./Environments/Testing/Hangfire.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre-production"'
      changes:
        - Environments/Testing/Hangfire.Testing.Dockerfile
        - Services/Fsel.Hangfire/**/*
        - Services/Shared/**/*

build-prod-hangfire:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/hangfire
    DOCKERFILE: ./Environments/Production/Hangfire.Production.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+$/'

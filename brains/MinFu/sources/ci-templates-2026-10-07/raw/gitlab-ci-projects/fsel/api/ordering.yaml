# build image ordering
build-test-ordering:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/ordering
    DOCKERFILE: ./Environments/Testing/Ordering.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "testing"'
      changes:
        - Environments/Testing/Ordering.Testing.Dockerfile
        - Services/Fsel.Ordering/**/*
        - Services/Shared/**/*

build-staging-ordering:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/ordering
    DOCKERFILE: ./Environments/Staging/Ordering.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      changes:
        - Services/Fsel.Ordering/**/*
        - Services/Shared/**/*

build-pre-prod-ordering:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/ordering
    DOCKERFILE: ./Environments/Testing/Ordering.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre-production"'
      changes:
        - Environments/Testing/Ordering.Testing.Dockerfile
        - Services/Fsel.Ordering/**/*
        - Services/Shared/**/*

build-prod-ordering:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/ordering
    DOCKERFILE: ./Environments/Production/Ordering.Production.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+$/'

# build image system
build-test-system:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/system
    DOCKERFILE: ./Environments/Testing/System.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "testing"'
      changes:
        - Environments/Testing/System.Testing.Dockerfile
        - Services/Fsel.System/**/*
        - Services/Shared/**/*

build-staging-system:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/system
    DOCKERFILE: ./Environments/Staging/System.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      changes:
        - Services/Fsel.System/**/*
        - Services/Shared/**/*

build-pre-prod-system:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/system
    DOCKERFILE: ./Environments/Testing/System.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre-production"'
      changes:
        - Environments/Testing/System.Testing.Dockerfile
        - Services/Fsel.System/**/*
        - Services/Shared/**/*

build-prod-system:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/system
    DOCKERFILE: ./Environments/Production/System.Production.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+$/'

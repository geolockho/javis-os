# build image notification
build-test-notification:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/notification
    DOCKERFILE: ./Environments/Testing/Notification.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "testing"'
      changes:
        - Environments/Testing/Notification.Testing.Dockerfile
        - Services/Fsel.Notification/**/*
        - Services/Shared/**/*

build-staging-notification:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/notification
    DOCKERFILE: ./Environments/Staging/Notification.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      changes:
        - Services/Fsel.Notification/**/*
        - Services/Shared/**/*
build-pre-prod-notification:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/notification
    DOCKERFILE: ./Environments/Testing/Notification.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre-production"'
      changes:
        - Environments/Testing/Notification.Testing.Dockerfile
        - Services/Fsel.Notification/**/*
        - Services/Shared/**/*

build-prod-notification:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/notification
    DOCKERFILE: ./Environments/Production/Notification.Production.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+$/'

# build image auth
build-test-auth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/auth
    DOCKERFILE: ./Environments/Testing/Auth.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "testing"'
      changes:
        - Environments/Testing/Auth.Testing.Dockerfile
        - Services/Fsel.Identity/**/*
        - Services/Shared/**/*

build-staging-auth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/auth
    DOCKERFILE: ./Environments/Staging/Auth.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      changes:
        - Services/Fsel.Identity/**/*
        - Services/Shared/**/*

build-pre-prod-auth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/auth
    DOCKERFILE: ./Environments/Testing/Auth.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre-production"'
      changes:
        - Environments/Testing/Auth.Testing.Dockerfile
        - Services/Fsel.Identity/**/*
        - Services/Shared/**/*

build-prod-auth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/auth
    DOCKERFILE: ./Environments/Production/Auth.Production.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+$/'

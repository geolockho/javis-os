# build image training
build-test-training:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/training
    DOCKERFILE: ./Environments/Testing/Training.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "testing"'
      changes:
        - Environments/Testing/Training.Testing.Dockerfile
        - Services/Fsel.Training/**/*
        - Services/Shared/**/*

build-staging-training:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/training
    DOCKERFILE: ./Environments/Staging/Training.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      changes:
        - Services/Fsel.Training/**/*
        - Services/Shared/**/*

build-pre-prod-training:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/training
    DOCKERFILE: ./Environments/Testing/Training.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre-production"'
      changes:
        - Environments/Testing/Training.Testing.Dockerfile
        - Services/Fsel.Training/**/*
        - Services/Shared/**/*

build-prod-training:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/training
    DOCKERFILE: ./Environments/Production/Training.Production.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+$/'

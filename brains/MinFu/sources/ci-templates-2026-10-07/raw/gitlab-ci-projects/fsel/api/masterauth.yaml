# build image masterauth
build-test-masterauth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/masterauth
    DOCKERFILE: ./Environments/Testing/MasterAuth.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "testing"'
      changes:
        - Environments/Testing/MasterAuth.Testing.Dockerfile
        - Services/Fsel.Master.Identity/**/*
        - Services/Shared/**/*

build-staging-masterauth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/masterauth
    DOCKERFILE: ./Environments/Staging/MasterAuth.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      changes:
        - Services/Fsel.Master.Identity/**/*
        - Services/Shared/**/*

build-pre-prod-masterauth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/masterauth
    DOCKERFILE: ./Environments/Testing/MasterAuth.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre-production"'
      changes:
        - Environments/Testing/MasterAuth.Testing.Dockerfile
        - Services/Fsel.Master.Identity/**/*
        - Services/Shared/**/*

build-prod-masterauth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/masterauth
    DOCKERFILE: ./Environments/Production/MasterAuth.Production.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+$/'

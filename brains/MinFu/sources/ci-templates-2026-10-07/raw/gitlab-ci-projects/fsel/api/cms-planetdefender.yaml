# build image cms-planetdefender
build-test-cms-planetdefender:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/cms-planetdefender
    DOCKERFILE: ./Environments/Testing/Cms.PlanetDefender.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "testing"'
      changes:
        - Environments/Testing/Cms.PlanetDefender.Testing.Dockerfile
        - Services/Fsel.Cms.PlanetDefender/**/*
        - Services/Shared/**/*

build-staging-cms-planetdefender:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/cms-planetdefender
    DOCKERFILE: ./Environments/Staging/Cms.PlanetDefender.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      changes:
        - Services/Fsel.Cms.PlanetDefender/**/*
        - Services/Shared/**/*

build-pre-prod-cms-planetdefender:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/cms-planetdefender
    DOCKERFILE: ./Environments/Testing/Cms.PlanetDefender.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre-production"'
      changes:
        - Environments/Testing/Cms.PlanetDefender.Testing.Dockerfile
        - Services/Fsel.Cms.PlanetDefender/**/*
        - Services/Shared/**/*

build-prod-cms-planetdefender:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/cms-planetdefender
    DOCKERFILE: ./Environments/Production/Cms.PlanetDefender.Production.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+$/'

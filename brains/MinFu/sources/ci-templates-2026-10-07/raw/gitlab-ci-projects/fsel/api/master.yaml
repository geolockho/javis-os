# build image master
build-test-master:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/master
    DOCKERFILE: ./Environments/Testing/Master.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "testing"'
      changes:
        - Environments/Testing/Master.Testing.Dockerfile
        - Services/Fsel.Master/**/*
        - Services/Shared/**/*

build-staging-master:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/master
    DOCKERFILE: ./Environments/Staging/Master.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      changes:
        - Services/Fsel.Master/**/*
        - Services/Shared/**/*

build-pre-prod-master:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/master
    DOCKERFILE: ./Environments/Testing/Master.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre-production"'
      changes:
        - Environments/Testing/Master.Testing.Dockerfile
        - Services/Fsel.Master/**/*
        - Services/Shared/**/*

build-prod-master:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/master
    DOCKERFILE: ./Environments/Production/Master.Production.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+$/'

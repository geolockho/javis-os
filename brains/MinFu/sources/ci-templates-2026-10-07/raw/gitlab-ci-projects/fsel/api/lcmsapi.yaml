# build image lcmsapi
build-test-lcmsapi:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/lcmsapi
    DOCKERFILE: ./Environments/Testing/Lcms.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "testing"'
      changes:
        - Environments/Testing/Lcms.Testing.Dockerfile
        - Services/Fsel.Course/**/*
        - Services/Shared/**/*

build-staging-lcmsapi:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/lcmsapi
    DOCKERFILE: ./Environments/Staging/Lcms.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      changes:
        - Services/Fsel.Course/**/*
        - Services/Shared/**/*

build-pre-prod-lcmsapi:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/lcmsapi
    DOCKERFILE: ./Environments/Testing/Lcms.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre-production"'
      changes:
        - Environments/Testing/Lcms.Testing.Dockerfile
        - Services/Fsel.Course/**/*
        - Services/Shared/**/*

build-prod-lcmsapi:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/lcmsapi
    DOCKERFILE: ./Environments/Production/Lcms.Production.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+$/'

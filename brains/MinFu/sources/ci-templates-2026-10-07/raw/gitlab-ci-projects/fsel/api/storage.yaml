# build image storage
build-test-storage:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/storage
    DOCKERFILE: ./Environments/Testing/Storage.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "testing"'
      changes:
        - Environments/Testing/Storage.Testing.Dockerfile
        - Services/Fsel.Storage/**/*
        - Services/Shared/**/*

build-staging-storage:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/storage
    DOCKERFILE: ./Environments/Staging/Storage.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      changes:
        - Services/Fsel.Storage/**/*
        - Services/Shared/**/*

build-pre-prod-storage:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/storage
    DOCKERFILE: ./Environments/Testing/Storage.Testing.Dockerfile
  extends:
    - .nexus-nuget
    - .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre-production"'
      changes:
        - Environments/Testing/Storage.Testing.Dockerfile
        - Services/Fsel.Storage/**/*
        - Services/Shared/**/*

build-prod-storage:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/storage
    DOCKERFILE: ./Environments/Production/Storage.Production.Dockerfile
  extends: .build-image-gitlab-registry
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+$/'

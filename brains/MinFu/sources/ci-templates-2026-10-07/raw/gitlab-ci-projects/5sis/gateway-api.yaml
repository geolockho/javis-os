# build image academic
build-test-gateway:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/5sis/api/gateway
    DOCKERFILE: ./Environments/Testing/Gateway.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/FiveSIS.Gateway/FiveSIS.Gateway.Api/**/*
      - Services/Shared/FiveSIS.Shared/**/*
    refs:
      - testing
build-staging-gateway:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/5sis/api/gateway
    DOCKERFILE: ./Environments/Staging/Gateway.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/FiveSIS.Gateway/FiveSIS.Gateway.Api/**/*
      - Services/Shared/FiveSIS.Shared/**/*
    refs:
      - staging
build-prod-gateway:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/5sis/api/gateway
    DOCKERFILE: ./Environments/Production/Gateway.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/FiveSIS.Gateway/FiveSIS.Gateway.Api/**/*
      - Services/Shared/FiveSIS.Shared/**/*
    refs:
      - main
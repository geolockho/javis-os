# build image academic
build-test-academic:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/5sis/api/academic
    DOCKERFILE: ./Environments/Testing/Academic.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/FiveSIS.Academic/**/*
      - Services/Shared/FiveSIS.Shared/**/*
    refs:
      - testing
build-staging-academic:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/5sis/api/academic
    DOCKERFILE: ./Environments/Staging/Academic.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/FiveSIS.Academic/**/*
      - Services/Shared/FiveSIS.Shared/**/*
    refs:
      - staging
build-prod-academic:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/5sis/api/academic
    DOCKERFILE: ./Environments/Production/Academic.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/FiveSIS.Academic/**/*
      - Services/Shared/FiveSIS.Shared/**/*
    refs:
      - main
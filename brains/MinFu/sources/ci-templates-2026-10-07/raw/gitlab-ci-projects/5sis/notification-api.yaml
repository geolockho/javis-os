# build image notification
build-test-notification:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/5sis/api/notification
    DOCKERFILE: ./Environments/Testing/Notification.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/FiveSIS.Notification/**/*
      - Services/Shared/FiveSIS.Shared/**/*
    refs:
      - testing

build-staging-notification:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/5sis/api/notification
    DOCKERFILE: ./Environments/Staging/Notification.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/FiveSIS.Notification/**/*
      - Services/Shared/FiveSIS.Shared/**/*
    refs:
      - staging
build-prod-notification:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/5sis/api/notification
    DOCKERFILE: ./Environments/Production/Notification.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/FiveSIS.Notification/**/*
      - Services/Shared/FiveSIS.Shared/**/*
    refs:
      - main
# build image auth
build-test-auth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/auth
    DOCKERFILE: ./Environments/Testing/Auth.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Identity/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-lhp-onpremise-auth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/auth
    DOCKERFILE: ./Environments/Testing/Auth.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Identity/**/*
      - Services/Shared/**/*
    refs:
      - lhp-onpremise

build-staging-auth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/auth
    DOCKERFILE: ./Environments/Staging/Auth.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Identity/**/*
      - Services/Shared/**/*
    refs:
      - staging

build-prod-auth:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/auth
    DOCKERFILE: ./Environments/Production/Auth.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Identity/**/*
      - Services/Shared/**/*
    refs:
      - "/^prod-[0-9]+\\.[0-9]+\\.[0-9]+$/"
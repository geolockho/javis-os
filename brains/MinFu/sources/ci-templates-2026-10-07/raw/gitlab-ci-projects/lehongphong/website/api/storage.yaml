# build image auth
build-test-storage:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/storage
    DOCKERFILE: ./Environments/Testing/Storage.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Storage/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-lhp-onpremise-storage:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/storage
    DOCKERFILE: ./Environments/Testing/Storage.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Storage/**/*
      - Services/Shared/**/*
    refs:
      - lhp-onpremise

build-staging-storage:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/storage
    DOCKERFILE: ./Environments/Staging/Storage.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Storage/**/*
      - Services/Shared/**/*
    refs:
      - staging

build-prod-storage:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/storage
    DOCKERFILE: ./Environments/Production/Storage.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Storage/**/*
      - Services/Shared/**/*
    refs:
      - "/^prod-[0-9]+\\.[0-9]+\\.[0-9]+$/"

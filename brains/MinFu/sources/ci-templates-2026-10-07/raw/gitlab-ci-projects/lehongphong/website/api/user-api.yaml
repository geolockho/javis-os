# build image user
build-test-user:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/user
    DOCKERFILE: ./Environments/Testing/User.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Identity/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-lhp-onpremise-user:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/user
    DOCKERFILE: ./Environments/Testing/User.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Identity/**/*
      - Services/Shared/**/*
    refs:
      - lhp-onpremise

build-staging-user:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/user
    DOCKERFILE: ./Environments/Staging/User.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Identity/**/*
      - Services/Shared/**/*
    refs:
      - staging

build-prod-user:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/user
    DOCKERFILE: ./Environments/Production/User.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Identity/**/*
      - Services/Shared/**/*
    refs:
      - "/^prod-[0-9]+\\.[0-9]+\\.[0-9]+$/"
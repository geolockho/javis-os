# build image auth
build-test-scientist:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/scientist
    DOCKERFILE: ./Environments/Testing/Scientist.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Scientist/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-lhp-onpremise-scientist:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/scientist
    DOCKERFILE: ./Environments/Testing/Scientist.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Scientist/**/*
      - Services/Shared/**/*
    refs:
      - lhp-onpremise

build-staging-scientist:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/scientist
    DOCKERFILE: ./Environments/Staging/Scientist.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Scientist/**/*
      - Services/Shared/**/*
    refs:
      - staging

build-prod-scientist:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/scientist
    DOCKERFILE: ./Environments/Production/Scientist.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Scientist/**/*
      - Services/Shared/**/*
    refs:
      - "/^prod-[0-9]+\\.[0-9]+\\.[0-9]+$/"

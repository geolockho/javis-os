# build image cms
build-test-cms:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/cms
    DOCKERFILE: ./Environments/Testing/Cms.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Cms/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-lhp-onpremise-cms:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/cms
    DOCKERFILE: ./Environments/Testing/Cms.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Cms/**/*
      - Services/Shared/**/*
    refs:
      - lhp-onpremise

build-staging-cms:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/cms
    DOCKERFILE: ./Environments/Staging/Cms.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Cms/**/*
      - Services/Shared/**/*
    refs:
      - staging

build-prod-cms:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/cms
    DOCKERFILE: ./Environments/Production/Cms.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Cms/**/*
      - Services/Shared/**/*
    refs:
      - "/^prod-[0-9]+\\.[0-9]+\\.[0-9]+$/"
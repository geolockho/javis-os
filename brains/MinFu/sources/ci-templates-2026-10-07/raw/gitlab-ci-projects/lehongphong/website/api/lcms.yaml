# build image lcms
build-test-lcms:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/lcmsapi
    DOCKERFILE: ./Environments/Testing/Lcms.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Lcms/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-lhp-onpremise-lcms:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/lcmsapi
    DOCKERFILE: ./Environments/Testing/Lcms.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Lcms/**/*
      - Services/Shared/**/*
    refs:
      - lhp-onpremise

build-staging-lcms:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/lcmsapi
    DOCKERFILE: ./Environments/Staging/Lcms.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Lcms/**/*
      - Services/Shared/**/*
    refs:
      - staging

build-prod-lcms:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/lcmsapi
    DOCKERFILE: ./Environments/Production/Lcms.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Lcms/**/*
      - Services/Shared/**/*
    refs:
      - "/^prod-[0-9]+\\.[0-9]+\\.[0-9]+$/"
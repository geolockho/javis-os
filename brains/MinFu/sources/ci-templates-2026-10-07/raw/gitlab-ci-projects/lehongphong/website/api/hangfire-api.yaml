# build image hangfire
build-test-hangfire:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/hangfire
    DOCKERFILE: ./Environments/Testing/HangFire.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Hangfire/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-lhp-onpremise-hangfire:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/hangfire
    DOCKERFILE: ./Environments/Testing/HangFire.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Hangfire/**/*
      - Services/Shared/**/*
    refs:
      - lhp-onpremise

build-staging-hangfire:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/hangfire
    DOCKERFILE: ./Environments/Staging/HangFire.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Hangfire/**/*
      - Services/Shared/**/*
    refs:
      - staging

build-prod-hangfire:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/hangfire
    DOCKERFILE: ./Environments/Production/HangFire.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Hangfire/**/*
      - Services/Shared/**/*
    refs:
      - "/^prod-[0-9]+\\.[0-9]+\\.[0-9]+$/"

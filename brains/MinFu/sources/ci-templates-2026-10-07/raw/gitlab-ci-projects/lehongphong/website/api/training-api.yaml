# build image training
build-test-training:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/training
    DOCKERFILE: ./Environments/Testing/Training.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Training/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-lhp-onpremise-training:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/training
    DOCKERFILE: ./Environments/Testing/Training.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Training/**/*
      - Services/Shared/**/*
    refs:
      - lhp-onpremise

build-staging-training:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/training
    DOCKERFILE: ./Environments/Staging/Training.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Training/**/*
      - Services/Shared/**/*
    refs:
      - staging

build-prod-training:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/training
    DOCKERFILE: ./Environments/Production/Training.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Training/**/*
      - Services/Shared/**/*
    refs:
      - "/^prod-[0-9]+\\.[0-9]+\\.[0-9]+$/"

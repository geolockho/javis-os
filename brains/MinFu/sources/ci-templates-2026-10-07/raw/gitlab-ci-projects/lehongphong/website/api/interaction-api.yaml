# build image Interaction
build-test-interaction:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/interaction
    DOCKERFILE: ./Environments/Testing/Interaction.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Interaction/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-lhp-onpremise-interaction:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/interaction
    DOCKERFILE: ./Environments/Testing/Interaction.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Interaction/**/*
      - Services/Shared/**/*
    refs:
      - lhp-onpremise

build-staging-interaction:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/interaction
    DOCKERFILE: ./Environments/Staging/Interaction.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Interaction/**/*
      - Services/Shared/**/*
    refs:
      - staging

build-prod-interaction:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/interaction
    DOCKERFILE: ./Environments/Production/Interaction.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Interaction/**/*
      - Services/Shared/**/*
    refs:
      - "/^prod-[0-9]+\\.[0-9]+\\.[0-9]+$/"

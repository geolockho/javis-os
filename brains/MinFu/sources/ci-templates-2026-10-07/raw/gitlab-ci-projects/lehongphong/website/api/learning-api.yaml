# build image Learning
build-test-learning:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/learning
    DOCKERFILE: ./Environments/Testing/Learning.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Learning/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-lhp-onpremise-learning:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/learning
    DOCKERFILE: ./Environments/Testing/Learning.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Learning/**/*
      - Services/Shared/**/*
    refs:
      - lhp-onpremise

build-staging-learning:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/learning
    DOCKERFILE: ./Environments/Staging/Learning.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Learning/**/*
      - Services/Shared/**/*
    refs:
      - staging

build-prod-learning:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/learning
    DOCKERFILE: ./Environments/Production/Learning.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Learning/**/*
      - Services/Shared/**/*
    refs:
      - "/^prod-[0-9]+\\.[0-9]+\\.[0-9]+$/"

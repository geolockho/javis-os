# build image auth
build-test-gateway:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/gateway
    DOCKERFILE: ./Environments/Testing/Gateway.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Gateway/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-lhp-onpremise-gateway:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/gateway
    DOCKERFILE: ./Environments/Testing/Gateway.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Gateway/**/*
      - Services/Shared/**/*
    refs:
      - lhp-onpremise

build-staging-gateway:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/gateway
    DOCKERFILE: ./Environments/Staging/Gateway.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Gateway/**/*
      - Services/Shared/**/*
    refs:
      - staging

build-prod-gateway:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/gateway
    DOCKERFILE: ./Environments/Production/Gateway.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Gateway/**/*
      - Services/Shared/**/*
    refs:
      - "/^prod-[0-9]+\\.[0-9]+\\.[0-9]+$/"

# build image sender
build-test-sender:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/sender
    DOCKERFILE: ./Environments/Testing/Sender.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Sender/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-lhp-onpremise-sender:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/sender
    DOCKERFILE: ./Environments/Testing/Sender.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Sender/**/*
      - Services/Shared/**/*
    refs:
      - lhp-onpremise

build-staging-sender:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/sender
    DOCKERFILE: ./Environments/Staging/Sender.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Sender/**/*
      - Services/Shared/**/*
    refs:
      - staging

build-prod-sender:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/outsource/lehongphong/api/infoportal/sender
    DOCKERFILE: ./Environments/Production/Sender.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/LHP.Sender/**/*
      - Services/Shared/**/*
    refs:
      - "/^prod-[0-9]+\\.[0-9]+\\.[0-9]+$/"
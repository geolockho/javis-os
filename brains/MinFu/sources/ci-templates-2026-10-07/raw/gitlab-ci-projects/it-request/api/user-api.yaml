build-test-user:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/it-request/api/user
    DOCKERFILE: ./Environments/Testing/User.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/ITRequest.Identity/**/*
      - Services/Shared/ITRequest.Shared/**/*
    refs:
      - testing
build-staging-user:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/it-request/api/user
    DOCKERFILE: ./Environments/Staging/User.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/ITRequest.Identity/**/*
      - Services/Shared/ITRequest.Shared/**/*
    refs:
      - staging
build-prod-user:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/it-request/api/user
    DOCKERFILE: ./Environments/Production/User.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/ITRequest.Identity/**/*
      - Services/Shared/ITRequest.Shared/**/*
    refs:
      - main
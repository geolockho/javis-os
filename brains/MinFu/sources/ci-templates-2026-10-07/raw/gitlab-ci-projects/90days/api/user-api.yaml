# build image user
build-test-user:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/90days/api/user
    DOCKERFILE: ./Environments/Testing/User.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/NinetyDays.Identity/**/*
      - Services/Shared/NinetyDays.Shared/**/*
    refs:
      - testing
build-staging-user:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/90days/api/user
    DOCKERFILE: ./Environments/Staging/User.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/NinetyDays.Identity/**/*
      - Services/Shared/NinetyDays.Shared/**/*
    refs:
      - staging
build-prod-user:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/90days/api/user
    DOCKERFILE: ./Environments/Production/User.Production.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/NinetyDays.Identity/**/*
      - Services/Shared/NinetyDays.Shared/**/*
    refs:
      - main
  tags:
    - atlantic-k8s
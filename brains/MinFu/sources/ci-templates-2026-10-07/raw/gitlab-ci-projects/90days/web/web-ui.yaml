# build image fe
build-test-web:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/90days/web
    DOCKERFILE: ./docker/develop/Dockerfile
  extends: .build-image-gitlab-registry
  only:
    - testing

build-staging-web:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/90days/web
    DOCKERFILE: ./docker/uat/Dockerfile
  extends: .build-image-gitlab-registry
  only:
    - staging

build-prod-web:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/90days/web
    DOCKERFILE: ./docker/uat/Dockerfile
  extends: .build-image-gitlab-registry
  only:
    refs:
      - /^prod-[0-9]+\.[0-9]+\.[0-9]+$/
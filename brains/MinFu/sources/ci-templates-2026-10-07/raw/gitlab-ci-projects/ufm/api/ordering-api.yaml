# build image ordering
build-test-ordering:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/ordering
    DOCKERFILE: ./Environments/Testing/Ordering.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/Fsel.Ordering/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-staging-ordering:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/ordering
    DOCKERFILE: ./Environments/Staging/Ordering.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/Fsel.Ordering/**/*
      - Services/Shared/**/*
    refs:
      - ufm-prod

      
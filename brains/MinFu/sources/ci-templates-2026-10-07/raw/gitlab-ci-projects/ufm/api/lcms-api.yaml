# build image lcmsapi
build-test-lcmsapi:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/lcmsapi
    DOCKERFILE: ./Environments/Testing/Lcms.Testing.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/Fsel.Course/**/*
      - Services/Shared/**/*
    refs:
      - testing

build-staging-lcmsapi:
  variables:
    IMAGE_NAME: registry.fsel.edu.vn/fsel/api/fsel_src/lcmsapi
    DOCKERFILE: ./Environments/Staging/Lcms.Staging.Dockerfile
  extends: .build-image-gitlab-registry
  only:
    changes:
      - Services/Fsel.Course/**/*
      - Services/Shared/**/*
    refs:
      - ufm-prod

      
# Một Ingress MỖI HOST ở gc. Host phải TRÙNG với Ingress trên sc.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-edge
  namespace: edge
  annotations:
    # --- upstream là sc qua HTTPS + mTLS ---
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "edge/edge-client-mtls"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-verify-depth: "1"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: "api.example.com"   # = host, để sc chọn đúng server block
    nginx.ingress.kubernetes.io/proxy-ssl-protocols: "TLSv1.2 TLSv1.3"
    # --- timeout tính thêm RTT liên cloud, retry chỉ khi lỗi kết nối ---
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "2"
    # --- bảo vệ biên ---
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  tls:
  - hosts: ["api.example.com"]
    secretName: api-example-com-tls      # TLS phiên 1: client <-> gc. Secret do bạn tự tạo/nạp sẵn trên gc
  rules:
  - host: api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sc
            port:
              number: 443

# Client cert để gc bắt tay mTLS với sc. cert-manager (CA issuer) tự điền ca.crt vào Secret,
# nên Secret này dùng thẳng cho annotation proxy-ssl-secret (cần tls.crt + tls.key + ca.crt).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-client
  namespace: edge
spec:
  secretName: edge-client-mtls
  issuerRef:
    kind: ClusterIssuer
    name: internal-ca
  commonName: edge-gc
  usages:
  - digital signature
  - key encipherment
  - client auth
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256

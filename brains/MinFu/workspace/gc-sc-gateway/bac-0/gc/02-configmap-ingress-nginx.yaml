apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
data:
  # IP client thật từ Cloudflare
  use-forwarded-headers: "true"
  forwarded-for-header: "CF-Connecting-IP"
  proxy-real-ip-cidr: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
  # giữ kết nối lâu qua kênh liên cloud, tránh TLS handshake mỗi request
  upstream-keepalive-connections: "200"
  upstream-keepalive-requests: "10000"
  upstream-keepalive-timeout: "60"
  # trace
  enable-opentelemetry: "true"
  otlp-collector-host: "otel-collector.observability.svc"
  otlp-collector-port: "4317"
  otel-service-name: "ingress-gc"
  # log để tách lỗi đường truyền / lỗi sc
  log-format-escape-json: "true"
  log-format-upstream: '{"ts":"$time_iso8601","req_id":"$req_id","host":"$host","uri":"$request_uri","status":$status,"upstream":"$upstream_addr","up_status":"$upstream_status","up_connect":"$upstream_connect_time","up_time":"$upstream_response_time","req_time":$request_time,"client":"$remote_addr"}'

# Bậc 1: gc chỉ cần CA để VERIFY cert server của sc. Không có cert client.
# ingress-nginx chấp nhận Secret chỉ có ca.crt cho proxy-ssl-secret.
# Tạo bằng lệnh (không cần sửa file này):
#   kubectl --context=gc -n edge create secret generic sc-ca --from-file=ca.crt=shared/ca.crt
apiVersion: v1
kind: Secret
metadata:
  name: sc-ca
  namespace: edge
type: Opaque
data:
  ca.crt: ""   # TODO: base64 của shared/ca.crt nếu muốn apply bằng file thay vì lệnh trên

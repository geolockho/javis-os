<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cấp kubeconfig</title>
  <script>
    // Đặt theme trước khi vẽ trang để không bị nháy sáng
    try { var t = localStorage.getItem('kg-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <style>
    :root, [data-theme=dark] {
      --bg:#0a0e13; --panel:#10161e; --panel-2:#151d27; --line:#1f2a37; --line-2:#2b3a4b;
      --text:#d7e1ec; --muted:#7f90a4; --accent:#22d3ee; --accent-ink:#03161c;
      --ok:#34d399; --warn:#fbbf24; --err:#f87171; --info:#60a5fa; --gray:#94a3b8;
      --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 28px rgba(0,0,0,.35);
      --dot:rgba(148,163,184,.07); --glow:.35;
      color-scheme: dark;
    }
    [data-theme=light] {
      --bg:#f3f5f8; --panel:#ffffff; --panel-2:#f6f8fb; --line:#e2e7ed; --line-2:#cdd6e0;
      --text:#17202b; --muted:#5d6b7b; --accent:#0e7490; --accent-ink:#ffffff;
      --ok:#047857; --warn:#b45309; --err:#dc2626; --info:#1d4ed8; --gray:#64748b;
      --shadow:0 1px 2px rgba(16,24,40,.06), 0 6px 18px rgba(16,24,40,.06);
      --dot:rgba(15,23,42,.05); --glow:0;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.5;
      color: var(--text); background-color: var(--bg);
      background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0); background-size: 22px 22px;
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, .mono, kbd { font-family: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
    code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
    kbd { border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); }
    .muted { color: var(--muted); }
    .small { font-size: 12.5px; }
    .inline { display: inline; }
    [hidden] { display: none !important; }

    /* ---------- header */
    .topbar {
      position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 6px;
      padding: 10px 24px; border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(8px);
    }
    .brand { display: flex; align-items: center; gap: 8px; margin-right: 18px; color: var(--text); font-weight: 600; }
    .brand:hover { text-decoration: none; }
    .brand .prompt { color: var(--accent); font-family: ui-monospace, Consolas, monospace; text-shadow: 0 0 10px color-mix(in srgb, var(--accent) calc(var(--glow) * 100%), transparent); }
    .brand .sub { color: var(--muted); font-weight: 400; }
    .nav a { color: var(--muted); padding: 6px 10px; border-radius: 6px; }
    .nav a:hover { color: var(--text); background: var(--panel-2); text-decoration: none; }
    .nav a.active { color: var(--text); background: var(--panel-2); box-shadow: inset 0 -2px 0 var(--accent); }
    .who { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); }
    .icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; font-size: 15px; }
    .icon-btn:hover { border-color: var(--line-2); }

    main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
    h2 { font-size: 15px; margin: 36px 0 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
    .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }

    /* ---------- panel, nút, ô nhập */
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; font: inherit; font-size: 13.5px; font-weight: 500;
      border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); cursor: pointer; white-space: nowrap;
    }
    .btn:hover { border-color: var(--muted); text-decoration: none; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn-pri:hover { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    .btn-danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--line)); background: transparent; }
    .btn-danger:hover { border-color: var(--err); background: color-mix(in srgb, var(--err) 10%, transparent); }
    .btn-ghost { background: transparent; }
    .btn-sm { padding: 4px 10px; font-size: 12.5px; border-radius: 6px; }
    .btn-lg { padding: 11px 22px; font-size: 15px; border-radius: 10px; }
    input[type=text], input[type=search] {
      font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); min-width: 0;
    }
    input:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- badge trạng thái */
    .badge {
      --c: var(--gray); display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px;
      font-size: 12px; font-weight: 500; white-space: nowrap; color: var(--c);
      border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 12%, transparent);
      box-shadow: 0 0 10px color-mix(in srgb, var(--c) calc(var(--glow) * 60%), transparent);
    }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
    .b-pending { --c: var(--warn); }
    .b-approved, .b-issuing { --c: var(--info); }
    .b-issued, .b-ok { --c: var(--ok); }
    .b-rejected, .b-revoked, .b-revoke_failed, .b-error { --c: var(--err); }
    .b-cancelled, .b-expired { --c: var(--gray); }
    .b-pending::before, .b-issuing::before { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }

    /* ---------- bảng */
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
    th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--panel-2); white-space: nowrap; }
    tbody tr:hover td { background: color-mix(in srgb, var(--accent) 4%, transparent); }
    tbody tr:last-child td { border-bottom: 0; }
    td.empty { text-align: center; padding: 28px; color: var(--muted); }
    .target { white-space: nowrap; }
    .target .cl { color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }

    /* ---------- đếm ngược */
    .countdown { margin-top: 8px; }
    .countdown .bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
    .countdown .bar span { display: block; height: 100%; width: 100%; background: var(--ok); border-radius: 4px; transition: width .9s linear; box-shadow: 0 0 8px color-mix(in srgb, var(--ok) calc(var(--glow) * 100%), transparent); }
    .countdown .cd-text { margin-top: 4px; font-size: 12.5px; }
    .countdown .cd-left { font-family: ui-monospace, Consolas, monospace; color: var(--ok); }
    .countdown.cd-warn .bar span { background: var(--warn); }
    .countdown.cd-warn .cd-left { color: var(--warn); }
    .countdown.cd-over .cd-left { color: var(--gray); }

    /* ---------- toast */
    .toasts { position: fixed; top: 64px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 40px)); }
    .toast {
      --c: var(--ok); display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px;
      background: var(--panel); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); box-shadow: var(--shadow);
      border-left: 3px solid var(--c); animation: slide .2s ease-out;
    }
    .toast.err { --c: var(--err); }
    .toast .t-body { flex: 1; }
    .toast button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
    .toast.hide { opacity: 0; transform: translateX(16px); transition: all .25s; }
    @keyframes slide { from { opacity: 0; transform: translateX(16px); } }

    @media (max-width: 720px) {
      .topbar { flex-wrap: wrap; padding: 10px 14px; }
      .who .email { display: none; }
      main { padding: 20px 14px 48px; }
    }
    
    .center { max-width: 560px; margin: 48px auto 0; padding: 32px; text-align: center; }
    .center .ico { font-family: ui-monospace, Consolas, monospace; font-size: 28px; color: var(--err); margin-bottom: 8px; }
    .errbox { margin: 16px 0 20px; padding: 10px 14px; border-radius: 8px; text-align: left; color: var(--err);
      background: color-mix(in srgb, var(--err) 10%, transparent); border: 1px solid color-mix(in srgb, var(--err) 35%, transparent); }

  </style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/"><span class="prompt">❯_</span><span>kubeconfig<span class="sub">.generator</span></span></a>
  <nav class="nav">
    <a href="/" class="">Yêu cầu của tôi</a>
    
  </nav>
  <div class="who">
    
    <button class="icon-btn" type="button" id="theme-btn" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối">◐</button>
    
  </div>
</header>

<div class="toasts" id="toasts">
  
  
</div>

<main>
  
<div class="panel center">
  <div class="ico">✕</div>
  <h1>Không thực hiện được</h1>
  <div class="errbox">Bạn không có quyền vào trang này</div>
  <a class="btn" href="/">← Về trang chính</a>
</div>

</main>

<script>
(function () {
  // --- theme sáng/tối, nhớ trong localStorage
  var root = document.documentElement;
  document.getElementById('theme-btn').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('kg-theme', next); } catch (e) {}
  });

  // --- toast: thông báo OK tự ẩn sau 6 giây, lỗi thì giữ tới khi đóng
  function closeToast(t) { t.classList.add('hide'); setTimeout(function () { t.remove(); }, 260); }
  document.querySelectorAll('#toasts .toast').forEach(function (t) {
    t.querySelector('button').addEventListener('click', function () { closeToast(t); });
    if (t.classList.contains('ok')) setTimeout(function () { closeToast(t); }, 6000);
  });
  // Bỏ ?msg= / ?err= khỏi thanh địa chỉ để F5 không hiện lại thông báo cũ
  if (/[?&](msg|err)=/.test(location.search)) history.replaceState(null, '', location.pathname);

  // --- copy vào clipboard (có đường lùi khi không phải HTTPS)
  window.kgCopy = function (text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? resolve() : reject(); } catch (x) { reject(x); }
      ta.remove();
    });
  };
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-copy-target]');
    if (!b) return;
    var src = document.getElementById(b.getAttribute('data-copy-target'));
    if (!src) return;
    var old = b.textContent;
    window.kgCopy(src.value !== undefined && src.tagName === 'INPUT' ? src.value : src.textContent.trim())
      .then(function () { b.textContent = 'Đã copy ✓'; }, function () { b.textContent = 'Copy lỗi'; })
      .then(function () { setTimeout(function () { b.textContent = old; }, 1600); });
  });

  // --- đếm ngược tới lúc hết hạn
  function left(ms) {
    if (ms <= 0) return 'đã hết hạn';
    var s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    if (d) return 'còn ' + d + ' ngày ' + h + ' giờ';
    if (h) return 'còn ' + h + ' giờ ' + m + ' phút';
    if (m) return 'còn ' + m + ' phút ' + (s % 60) + ' giây';
    return 'còn ' + s + ' giây';
  }
  function tick() {
    var now = Date.now();
    document.querySelectorAll('.countdown[data-end]').forEach(function (el) {
      var end = Date.parse(el.getAttribute('data-end'));
      if (isNaN(end)) return;
      var start = Date.parse(el.getAttribute('data-start') || '');
      var ms = end - now, t = el.querySelector('.cd-left'), bar = el.querySelector('.bar > span');
      if (t) t.textContent = left(ms);
      if (bar && !isNaN(start) && end > start) bar.style.width = (Math.max(0, Math.min(1, ms / (end - start))) * 100).toFixed(2) + '%';
      el.classList.toggle('cd-warn', ms > 0 && ms < 3600 * 1000);
      el.classList.toggle('cd-over', ms <= 0);
    });
  }
  tick(); setInterval(tick, 1000);
})();
</script>

</body>
</html>

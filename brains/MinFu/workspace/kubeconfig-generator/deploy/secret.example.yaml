# MẪU. Không commit bản có giá trị thật. Tạo Secret thật bằng kubectl, ví dụ:
#
#   kubectl -n fsel-internal-tools create secret generic kubeconfig-generator-env --from-env-file=.env
#   kubectl -n fsel-internal-tools create secret generic kubeconfig-generator-clusters \
#     --from-file=fsel-prod.yaml=./secrets/fsel-prod.yaml --from-file=fsel-local.yaml=./secrets/fsel-local.yaml
#   kubectl -n fsel-internal-tools create secret generic kubeconfig-generator-oauth2 \
#     --from-literal=client-id=... --from-literal=client-secret=... \
#     --from-literal=cookie-secret="$(openssl rand -base64 32 | tr -- '+/' '-_')"
#
# Hoặc dùng SealedSecret / External Secrets nếu ArgoCD quản lý.
apiVersion: v1
kind: Secret
metadata:
  name: kubeconfig-generator-oauth2
  namespace: fsel-internal-tools
type: Opaque
stringData:
  client-id: "<Application ID của OAuth app GitLab>"
  client-secret: "<Secret của OAuth app GitLab>"
  cookie-secret: "<32 byte ngẫu nhiên, base64url>"
---
apiVersion: v1
kind: Secret
metadata:
  name: kubeconfig-generator-clusters
  namespace: fsel-internal-tools
type: Opaque
stringData:
  fsel-prod.yaml: "<kubeconfig của SA kubeconfig-generator trên fsel-prod>"
  fsel-local.yaml: "<kubeconfig của SA kubeconfig-generator trên fsel-local>"
---
apiVersion: v1
kind: Secret
metadata:
  name: kubeconfig-generator-env
  namespace: fsel-internal-tools
type: Opaque
stringData:
  DATABASE_URL: "postgresql://kubeconfig_generator:<mật khẩu>@<host>:5432/kubeconfig_generator"
  PUBLIC_URL: "https://kubeconfig-generator.fsel.edu.vn"
  CLUSTERS: "fsel-prod,fsel-local"
  KUBECONFIG_FSEL_PROD: "/etc/kubeconfig-generator/clusters/fsel-prod.yaml"
  KUBECONFIG_FSEL_LOCAL: "/etc/kubeconfig-generator/clusters/fsel-local.yaml"
  ADMIN_EMAILS: "hophu@atlantic.edu.vn"
  SLACK_WEBHOOK_URL: ""

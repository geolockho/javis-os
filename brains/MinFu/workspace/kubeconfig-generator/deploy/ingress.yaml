apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubeconfig-generator
  namespace: fsel-internal-tools
  annotations:
    # Lớp phụ, không thay xác thực: chỉ cho dải IP văn phòng/VPN (bỏ comment và sửa dải IP)
    # nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8"
    # Cấp chứng chỉ TLS (nếu dùng cert-manager)
    # cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"   # cookie oauth2-proxy khá lớn
spec:
  ingressClassName: nginx   # TODO: sửa theo ingress class thật của fsel-local
  tls:
    - hosts: [kubeconfig-generator.fsel.edu.vn]
      secretName: kubeconfig-generator-tls
  rules:
    - host: kubeconfig-generator.fsel.edu.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubeconfig-generator
                port:
                  name: http

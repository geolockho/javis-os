# Triển khai trên fsel-local. 1 replica: rate limit và job dọn dẹp chạy trong bộ nhớ của app.
# App chỉ nghe 127.0.0.1:8000; mọi truy cập đi qua sidecar oauth2-proxy (cổng 4180),
# nên từ ngoài pod không thể gửi thẳng header danh tính giả tới app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeconfig-generator
  namespace: fsel-internal-tools
  labels:
    app.kubernetes.io/name: kubeconfig-generator
spec:
  replicas: 1
  strategy:
    type: Recreate          # không để 2 bản chạy chồng nhau lúc rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeconfig-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeconfig-generator
    spec:
      automountServiceAccountToken: false   # pod không cần quyền gì trên fsel-local qua SA của chính nó
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001        # file của volume clusters thuộc group 10001 để container app (uid 10001) đọc được
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: <REGISTRY>/other-services/kubeconfig-generator:0.1.0   # TODO: sửa theo registry thật
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: kubeconfig-generator-env
          securityContext:
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: clusters
              mountPath: /etc/kubeconfig-generator/clusters
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }

        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:8000/
            - --provider=gitlab
            - --oidc-issuer-url=https://gitlab.fsel.edu.vn
            - --scope=openid profile email
            - --email-domain=*
            - --redirect-url=https://kubeconfig-generator.fsel.edu.vn/oauth2/callback
            - --reverse-proxy=true
            - --real-client-ip-header=X-Real-IP
            - --pass-user-headers=true
            - --pass-access-token=false
            - --set-authorization-header=false
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=8h
            - --skip-provider-button=true
            - --skip-auth-route=GET=^/healthz$
            - --skip-auth-route=GET=^/readyz$
            - --skip-auth-strip-headers=true
            - --silence-ping-logging=true
            # Quyền xin namespace không dựa vào group. Ai đăng nhập được GitLab thì vào được trang,
            # admin duyệt từng request. Muốn hẹp hơn thì giới hạn domain email ở --email-domain.
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: kubeconfig-generator-oauth2, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: kubeconfig-generator-oauth2, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: kubeconfig-generator-oauth2, key: cookie-secret } }
          ports:
            - name: http
              containerPort: 4180
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /readyz, port: http }   # đi qua proxy tới app, kiểm cả DB
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: clusters
          secret:
            secretName: kubeconfig-generator-clusters
            defaultMode: 0440   # owner root + group fsGroup đọc được; 0400 làm uid 10001 bị Permission denied
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
